[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stress-index"
version = "1.0.0"
description = "Daily market stress index for the Moroccan stock market: press sentiment + market signals (CISS method)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "matplotlib>=3.8", "openpyxl>=3.1"]

[project.optional-dependencies]
collect = ["requests>=2.31", "beautifulsoup4>=4.12", "lxml>=5.0"]
score = ["torch>=2.2", "transformers>=4.40", "sentencepiece>=0.2", "protobuf>=4.25"]

[tool.setuptools.packages.find]
where = ["src"]
